# Template for /var/lib/noctalia-greeter/greeter.toml.
# This is for the desktop manager login screen shown after logout.
# It does not change GRUB.

[appearance]
scheme = "Custom"
theme_mode = "dark"
password_style = "filled_circles"
hide_logo = false
power_buttons_position = "hidden"
scheme_selector_position = "hidden"
corner_radius_scale = 1.0
font_family = "JetBrainsMono Nerd Font"

    [appearance.wallpaper]
    path = "/home/saeed/Pictures/wallpapers/earth.png"
    fill_mode = "cover"
    fill_color = "#1e1e2e"

    [appearance.palette]
    on_primary = "#1e1e2e"
    on_secondary = "#cba6f7"
    on_tertiary = "#89b4fa"
    on_error = "#f38ba8"
    on_surface = "#cdd6f4"
    on_surface_variant = "#bac2de"
    outline = "#585b70"
